name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        lowest: [false]
        include:
          - php: '8.1'
            lowest: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      # The Laravel integration is tested on Laravel 11+, which needs PHP 8.2. On PHP 8.1
      # only Laravel 10 would install, and it's end-of-life with open security advisories.
      - name: Drop Testbench on PHP 8.1
        if: matrix.php == '8.1'
        run: composer remove --dev orchestra/testbench --no-update --no-interaction
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.lowest && '--prefer-lowest' || '' }}
      - run: vendor/bin/phpunit ${{ matrix.php == '8.1' && '--testsuite unit' || '' }}

  static:
    name: PHPStan and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, json, zlib
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
